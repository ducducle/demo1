<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trạm Tụ Khí - Sunlit Focus</title>
    <style>
        :root {
            --bg-color: #fdf6e3; /* Màu nắng ấm */
            --text-color: #5c4b37;
            --accent: #f39c12;
            --box-bg: rgba(255, 255, 255, 0.85);
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Chế độ Tu Tiên / Boss Mode */
        body.tu-tien-mode {
            --bg-color: #0d1117; /* Đêm đen huyền bí */
            --text-color: #e6edf3;
            --accent: #ff3366; /* Đỏ rực */
            --box-bg: rgba(22, 27, 34, 0.9);
            --shadow: 0 0 20px rgba(255, 51, 102, 0.4);
            --font-main: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            transition: all 0.6s ease;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--box-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            width: 100%; max-width: 500px;
            transition: all 0.6s ease;
            position: relative;
            overflow: hidden;
        }

        h2 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        
        .sunbeam {
            position: absolute; top: -50px; left: -50px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(243,156,18,0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; z-index: 0;
            display: block;
        }
        body.tu-tien-mode .sunbeam { display: none; }

        /* Hố đen ý tưởng */
        .input-group { position: relative; z-index: 1; display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1; padding: 12px 15px; border-radius: 10px;
            border: 1px solid #ddd; outline: none;
            background: transparent; color: var(--text-color);
            font-family: var(--font-main); transition: all 0.3s;
        }
        body.tu-tien-mode input[type="text"] { border-color: var(--accent); }
        
        button {
            padding: 12px 20px; border: none; border-radius: 10px;
            background: var(--accent); color: #fff; cursor: pointer;
            font-weight: bold; transition: all 0.3s;
        }
        button:hover { transform: scale(1.05); }

        /* Danh sách việc */
        .task-list { list-style: none; padding: 0; margin: 0; position: relative; z-index: 1; }
        .task-item {
            background: rgba(0,0,0,0.03); padding: 15px; margin-bottom: 10px;
            border-radius: 10px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; border-left: 4px solid transparent;
        }
        .task-item:hover { border-left-color: var(--accent); background: rgba(0,0,0,0.06); }
        body.tu-tien-mode .task-item { background: rgba(255,255,255,0.05); }

        .btn-tutien {
            background: #2c3e50; font-size: 0.85em; padding: 6px 12px; border-radius: 5px;
        }
        body.tu-tien-mode .btn-tutien { display: none; }

        /* Màn hình Focus Mode */
        #focus-screen { display: none; text-align: center; position: relative; z-index: 1; }
        .timer { font-size: 3em; font-weight: bold; margin: 20px 0; color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        .btn-exit { background: transparent; border: 1px solid var(--text-color); color: var(--text-color); }
        
        /* Stats */
        .stats { display: flex; gap: 15px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="stats" id="stats">
        <span>☀️ Nắng: <span id="sun-count">0</span></span>
        <span>🎒 Hố đen: <span id="task-count">0</span></span>
    </div>

    <div class="container" id="main-container">
        <div class="sunbeam"></div>
        <div id="default-screen">
            <h2>Phòng Ngập Nắng 🛋️</h2>
            
            <div class="input-group">
                <input type="text" id="task-input" placeholder="Gõ vội ý tưởng / Task vào đây (Enter)...">
                <button onclick="addTask()">Ném</button>
            </div>

            <ul class="task-list" id="task-list">
                <!-- Task sẽ hiện ở đây -->
            </ul>
        </div>

        <div id="focus-screen">
            <h2>⚡ ĐỘ KIẾP ⚡</h2>
            <p>Đang tập trung diệt Tâm Ma:</p>
            <h3 id="focus-task-name" style="font-size: 1.5em; border-bottom: 2px dashed var(--accent); padding-bottom: 10px;">Tên Task</h3>
            <div class="timer">15:00</div>
            <button onclick="finishTask()">Chém Xong! (+2 ☀️)</button>
            <br><br>
            <button class="btn-exit" onclick="exitFocus()">Bỏ chạy (Thoát)</button>
        </div>
    </div>

    <script>
        let tasks = [];
        let sunCount = parseInt(localStorage.getItem('sunCount')) || 0;
        document.getElementById('sun-count').innerText = sunCount;

        const taskInput = document.getElementById('task-input');
        taskInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        function addTask() {
            const val = taskInput.value.trim();
            if(!val) return;
            tasks.push(val);
            taskInput.value = '';
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            document.getElementById('task-count').innerText = tasks.length;
            
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'task-item';
                li.innerHTML = `
                    <span>${task}</span>
                    <button class="btn-tutien" onclick="enterFocus(${index})">Độ Kiếp ⚡</button>
                `;
                list.appendChild(li);
            });
        }

        let currentFocusIndex = -1;
        function enterFocus(index) {
            currentFocusIndex = index;
            document.body.classList.add('tu-tien-mode');
            document.getElementById('default-screen').style.display = 'none';
            document.getElementById('focus-screen').style.display = 'block';
            document.getElementById('focus-task-name').innerText = tasks[index];
            document.getElementById('stats').style.display = 'none';
        }

        function exitFocus() {
            document.body.classList.remove('tu-tien-mode');
            document.getElementById('default-screen').style.display = 'block';
            document.getElementById('focus-screen').style.display = 'none';
            document.getElementById('stats').style.display = 'flex';
        }

        function finishTask() {
            if(currentFocusIndex > -1) {
                tasks.splice(currentFocusIndex, 1);
                sunCount += 2;
                localStorage.setItem('sunCount', sunCount);
                document.getElementById('sun-count').innerText = sunCount;
            }
            exitFocus();
            renderTasks();
        }
    </script>
</body>
</html>
